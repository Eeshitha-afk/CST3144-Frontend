<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> SkillSpace </title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js">  </script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

    </head>
    <body>
        <!-- The element where Vue will mount -->
        <div id="app">
            <header>
                <h1>SkillSpace</h1>
                <button v-on:click="toggleCart" v-bind:disabled="cartItemCount === 0 && showLessons">
                    <span class="fas fa-cart-plus" aria-hidden="true"></span>
                    {{ showLessons ? 'Cart' : 'Back to Lessons' }} ({{ cartItemCount }})
                </button>
            </header>
            <main>
                <div v-if="showLessons">
                    <!-- Display each lesson from the list -->
                    <div v-for="lesson in lessons" v-bind:key="lesson.id">
                        <h2>
                            <span v-bind:class="lesson.icon" aria-hidden="true"></span>
                            <span v-text="lesson.subject"></span>
                        </h2>
                        <p>Location: {{ lesson.location }}</p>
                        <p>Price: AED {{ lesson.price }}</p>
                        <p>Available Spaces: {{ lesson.spaces }}</p>
                        <button v-on:click="addToCart(lesson)" v-bind:disabled="lesson.spaces === 0">
                            Add to Cart
                        </button>
                    </div>
                </div>
                <div v-else>
                    <h2>Shopping Cart</h2>
                    <p v-if="cartItemCount === 0">Your cart is empty.</p>
                    <!-- Each entry represents one booked space -->
                    <div v-for="(lesson, index) in cartLessons" v-bind:key="index">
                        <h3 v-text="lesson.subject"></h3>
                        <p>Location: {{ lesson.location }}</p>
                        <p>Price: AED {{ lesson.price }}</p>
                        <button v-on:click="removeFromCart(index)">Remove</button>
                    </div>
                </div>
            </main>
        </div>
        <script type="text/javascript">
            let webstore = new Vue({ // The Vue instance
                el: '#app',
                data: {
                    showLessons: true,
                    // Sample lessons for the will be replaced later with data from the backend
                    lessons: [
                        {
                            id: 1001,
                            subject: 'Mathematics',
                            location: 'Dubai Knowledge Park',
                            price: 100,
                            spaces: 5,
                            icon: 'fas fa-calculator'
                        },
                        {
                            id: 1002,
                            subject: 'English',
                            location: 'Al Barsha',
                            price: 80,
                            spaces: 5,
                            icon: 'fas fa-book'
                        },
                        {
                            id: 1003,
                            subject: 'Science',
                            location: 'Dubai Marina',
                            price: 120,
                            spaces: 5,
                            icon: 'fas fa-flask'
                        },
                        {
                            id: 1004,
                            subject: 'Coding',
                            location: 'Dubai Knowledge Park',
                            price: 150,
                            spaces: 5,
                            icon: 'fas fa-code'
                        },
                        {
                            id: 1005,
                            subject: 'Art',
                            location: 'Jumeirah',
                            price: 90,
                            spaces: 5,
                            icon: 'fas fa-palette'
                        },
                        {
                            id: 1006,
                            subject: 'Music',
                            location: 'Al Barsha',
                            price: 110,
                            spaces: 5,
                            icon: 'fas fa-music'
                        },
                        {
                            id: 1007,
                            subject: 'Photography',
                            location: 'Dubai Marina',
                            price: 130,
                            spaces: 5,
                            icon: 'fas fa-camera'
                        },
                        {
                            id: 1008,
                            subject: 'Chess',
                            location: 'Jumeirah',
                            price: 70,
                            spaces: 5,
                            icon: 'fas fa-chess'
                        },
                        {
                            id: 1009,
                            subject: 'Cooking',
                            location: 'Deira',
                            price: 140,
                            spaces: 5,
                            icon: 'fas fa-utensils'
                        },
                        {
                            id: 1010,
                            subject: 'Drama',
                            location: 'Deira',
                            price: 95,
                            spaces: 5,
                            icon: 'fas fa-masks-theater'
                        }
                    ],
                    cart: [] // Store one lesson ID for each space added to the cart
                },
                methods: {
                    addToCart: function(lesson) {
                        if (lesson.spaces > 0) {
                            this.cart.push(lesson.id);
                            lesson.spaces--;
                        }
                    },
                    toggleCart: function() {
                        this.showLessons = !this.showLessons;
                    },
                    removeFromCart: function(index) {
                        let lesson = this.lessons.find(lesson => lesson.id === this.cart[index]);
                        if (lesson) {
                            this.cart.splice(index, 1);
                            lesson.spaces++;
                        }
                    }
                },
                computed: {
                    cartItemCount: function() {
                        return this.cart.length;
                    },
                    cartLessons: function() {
                        return this.cart.map(id => this.lessons.find(lesson => lesson.id === id));
                    }
                }
            });

        </script>
    </body>
</html>
